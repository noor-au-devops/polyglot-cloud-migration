name: CI Pipeline

on:
  push:
    branches: [ main, feature/*, fix/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0'
      - name: Restore & Test
        run: |
          cd backend-dotnet
          dotnet restore
          dotnet build
          dotnet test --no-build || true

  test-worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install & Test
        run: |
          cd worker-python
          pip install -r requirements.txt
          pip install flake8
          flake8 . --max-line-length=120 || true
          python -m py_compile app.py worker.py tasks.py

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      - name: Install & Lint
        run: |
          cd frontend-js
          npm install
          npm run lint || true
          npm run build

  build-and-push:
    needs: [test-backend, test-worker, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build & Push Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend-dotnet
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/polyglot-backend:latest
      - name: Build & Push Worker
        uses: docker/build-push-action@v4
        with:
          context: ./worker-python
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/polyglot-worker:latest
      - name: Build & Push Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend-js
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/polyglot-frontend:latest

  trigger-jenkins:
    needs: [build-and-push]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Jenkins
        run: |
          curl -X POST http://${{ secrets.JENKINS_URL }}/job/polyglot-deploy/build \
            --user "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}"